<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights Engine - Zone Visualization</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00d9ff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        .zone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .zone-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .zone-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .zone-critical { border-color: #ef4444; }
        .zone-low { border-color: #f97316; }
        .zone-average { border-color: #eab308; }
        .zone-good { border-color: #22c55e; }
        .zone-high { border-color: #06b6d4; }
        .zone-elite { border-color: #a855f7; }
        
        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .zone-number {
            font-size: 2em;
            font-weight: bold;
            opacity: 0.6;
        }
        .zone-range {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .zone-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .zone-section {
            margin: 15px 0;
        }
        .zone-section-title {
            font-weight: bold;
            color: #00d9ff;
            margin-bottom: 8px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .insight-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.85em;
            border-left: 3px solid #00d9ff;
        }
        .tip-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.85em;
            border-left: 3px solid #22c55e;
        }
        .tip-title {
            font-weight: bold;
            color: #22c55e;
            margin-bottom: 4px;
        }
        .stats {
            text-align: center;
            margin: 40px 0;
            padding: 30px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(0, 217, 255, 0.3);
        }
        .stats h2 {
            color: #00d9ff;
            margin-bottom: 20px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
        }
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #00d9ff;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 MindMirror Insights Engine</h1>
        <p class="subtitle">25 Cognitive Performance Zones | 3 Insights + 3 Tips Each</p>
        
        <div class="stats">
            <h2>📊 System Overview</h2>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-number">25</div>
                    <div class="stat-label">Total Zones</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">75</div>
                    <div class="stat-label">Total Insights</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">75</div>
                    <div class="stat-label">Total Health Tips</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">100</div>
                    <div class="stat-label">Score Range</div>
                </div>
            </div>
        </div>

        <div class="zone-grid" id="zoneGrid"></div>
    </div>

    <script type="module">
        // Import the insights engine
        import { COGNITIVE_ZONES, getZoneByScore, getScoreTheme } from './src/utils/insightsEngine.js';

        const zoneGrid = document.getElementById('zoneGrid');

        COGNITIVE_ZONES.forEach((zone, index) => {
            const zoneNum = index + 1;
            const [min, max] = zone.range;
            
            // Determine zone class based on score range
            let zoneClass = 'zone-critical';
            if (max > 20) zoneClass = 'zone-low';
            if (max > 36) zoneClass = 'zone-average';
            if (max > 52) zoneClass = 'zone-good';
            if (max > 68) zoneClass = 'zone-high';
            if (max > 84) zoneClass = 'zone-elite';

            const card = document.createElement('div');
            card.className = `zone-card ${zoneClass}`;
            card.innerHTML = `
                <div class="zone-header">
                    <div class="zone-number">#${zoneNum}</div>
                    <div class="zone-range">${min}-${max}</div>
                </div>
                <div class="zone-title">${zone.level}</div>
                
                <div class="zone-section">
                    <div class="zone-section-title">💡 Insights</div>
                    ${zone.insights.map(insight => `
                        <div class="insight-item">${insight}</div>
                    `).join('')}
                </div>
                
                <div class="zone-section">
                    <div class="zone-section-title">🎯 Health Tips</div>
                    ${zone.tips.map(tip => `
                        <div class="tip-item">
                            <div class="tip-title">${tip.title}</div>
                            ${tip.text}
                        </div>
                    `).join('')}
                </div>
            `;
            
            zoneGrid.appendChild(card);
        });

        console.log('✅ Insights Engine Loaded Successfully!');
        console.log(`📊 Total Zones: ${COGNITIVE_ZONES.length}`);
        
        // Test zone selection
        const testScores = [3, 15, 28, 40, 55, 67, 85, 98];
        console.log('\n🧪 Testing Zone Selection:');
        testScores.forEach(score => {
            const zone = getZoneByScore(score);
            const theme = getScoreTheme(score);
            console.log(`Score ${score} → Zone: ${zone.level} | Color: ${theme.primary}`);
        });
    </script>
</body>
</html>
