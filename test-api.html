<!DOCTYPE html>
<html>
<head>
    <title>Test ADHD Analysis API</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            background: #00ff00;
            color: #000;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px 5px;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        pre {
            background: #000;
            padding: 15px;
            border: 1px solid #00ff00;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #00ff00;
        }
        input {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            width: 400px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test ADHD Analysis API</h1>
        
        <h3>User ID:</h3>
        <input type="text" id="userId" value="691e068b0c4975c081cec5eb" />
        
        <h3>JWT Token (from localStorage):</h3>
        <input type="text" id="token" placeholder="Paste your token here or click 'Get from localStorage'" />
        <button onclick="getTokenFromStorage()">Get from localStorage</button>
        
        <br><br>
        <button onclick="testAPI()">Test API Call</button>
        <button onclick="clearOutput()">Clear Output</button>
        
        <h3>Response:</h3>
        <pre id="output">Click "Test API Call" to fetch data...</pre>
    </div>

    <script>
        function getTokenFromStorage() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('token').value = token;
                document.getElementById('output').innerHTML = '✅ Token retrieved from localStorage';
            } else {
                document.getElementById('output').innerHTML = '❌ No token found in localStorage';
            }
        }

        async function testAPI() {
            const userId = document.getElementById('userId').value;
            const token = document.getElementById('token').value;
            const output = document.getElementById('output');
            
            output.innerHTML = '🔄 Fetching data from API...\n\n';
            
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                output.innerHTML += `📡 Request Details:\n`;
                output.innerHTML += `   URL: http://localhost:5000/api/auth/adhd-analysis\n`;
                output.innerHTML += `   Method: GET\n`;
                output.innerHTML += `   Headers: ${JSON.stringify(headers, null, 2)}\n\n`;
                
                const response = await fetch('http://localhost:5000/api/auth/adhd-analysis', {
                    method: 'GET',
                    headers: headers
                });
                
                output.innerHTML += `📥 Response Status: ${response.status} ${response.statusText}\n\n`;
                
                const data = await response.json();
                
                if (response.ok) {
                    output.innerHTML += '✅ SUCCESS!\n\n';
                    output.innerHTML += '📊 Parsed Data:\n';
                    output.innerHTML += JSON.stringify(data, null, 2);
                    
                    // Extract metrics if available
                    if (data.gamesAnalyzed && data.gamesAnalyzed.length > 0) {
                        const metrics = data.gamesAnalyzed[data.gamesAnalyzed.length - 1].metrics;
                        output.innerHTML += '\n\n🎯 METRICS TO DISPLAY:\n';
                        output.innerHTML += `   Cognitive Performance: ${metrics.cognitivePerformance}\n`;
                        output.innerHTML += `   Final Attention: ${metrics.finalAttention}\n`;
                        output.innerHTML += `   Motor Control: ${metrics.motorControl}\n`;
                        output.innerHTML += `   Cognitive Load: ${metrics.cognitiveLoad}\n`;
                        output.innerHTML += `   Behavioral Stability: ${metrics.behavioralStability}\n`;
                        output.innerHTML += `   NeuroBalance: ${metrics.neuroBalance}\n`;
                    }
                } else {
                    output.innerHTML += '❌ ERROR!\n\n';
                    output.innerHTML += JSON.stringify(data, null, 2);
                }
            } catch (error) {
                output.innerHTML += `\n\n❌ FETCH ERROR:\n${error.message}`;
                output.innerHTML += `\n\nMake sure:\n`;
                output.innerHTML += `1. Backend server is running on port 5000\n`;
                output.innerHTML += `2. CORS is enabled on backend\n`;
                output.innerHTML += `3. You have a valid JWT token\n`;
            }
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = 'Output cleared. Click "Test API Call" to fetch data...';
        }
        
        // Auto-try to get token on load
        window.onload = function() {
            getTokenFromStorage();
        };
    </script>
</body>
</html>
